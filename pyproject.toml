[project]
name = "cua-lark-15"
version = "0.0.3"
description = "LarkVision-Tester 主仓: TuriX-CUA 二开 + 飞书桌面端视觉测试 Agent (CUA-Lark-15)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CUA-Lark-15 Team" },
]
license = { text = "MIT" }

# 主仓只装"自研补强模块" (verifier / reporter / bench) 需要的依赖.
# CUA 主进程 (TuriX) 用 larkvision/ 内自带的独立 venv (Python 3.12 + LangChain 全家桶), 不在这里.
dependencies = [
    # 视觉验证 L1 + L2
    "opencv-python>=4.10.0.84",
    "scikit-image>=0.24.0",
    "numpy>=1.26.0,<2.0.0",
    "pillow>=10.4.0",
    "rapidocr-onnxruntime>=1.4.0",

    # bench / reporter / dashboard
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "streamlit>=1.40.0",

    # 工具
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "bench"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["larkvision"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
