[project]
name = "lark-vision-tester"
version = "0.1.0"
description = "LarkVision-Tester: 飞书桌面端视觉驱动智能测试 Agent (CUA-Lark-15)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CUA-Lark-15 Team" },
]
license = { text = "MIT" }

dependencies = [
    # LLM SDK (火山方舟豆包)
    "volcengine-python-sdk[ark]>=4.0.0",
    "openai>=1.50.0",  # 兼容 OpenAI 协议
    "httpx>=0.27.0",
    # 截图与图像
    "mss>=9.0.1",
    "pillow>=10.4.0",
    "opencv-python>=4.10.0.84",
    "scikit-image>=0.24.0",
    "numpy>=1.26.0,<2.0.0",  # 与 paddleocr/cv2 兼容
    # OCR
    "rapidocr-onnxruntime>=1.4.0",  # 轻量稳定，PaddleOCR 备选
    # 鼠标键盘控制
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
    # Agent 编排
    "langgraph>=0.2.50",
    "langchain-core>=0.3.0",
    # 评估与可视化
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    # 工具
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "loguru>=0.7.2",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "pyperclip>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
lvt = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
